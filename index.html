<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Instant Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-wrapper">

    <!-- Gender Selection -->
    <section id="gender-section">
        <h2>Select Gender</h2>

        <button class="gender-btn" data-gender="male">👨</button>
        <button class="gender-btn" data-gender="female">👩</button>
    </section>

    <!-- Interest Selection -->
    <section id="interest-section" style="display:none;">
        <h2>Select Interest</h2>
        <div id="interest-options"></div>
    </section>

    <!-- Brand Selection -->
    <section id="brand-section" style="display:none;">
        <h2>Select Brand</h2>
        <div id="brand-options" class="brand-grid"></div>
    </section>

    <!-- Model Selection (Cars & Bikes Only) -->
    <section id="model-section" style="display:none;">
        <h2>Select Model</h2>
        <div id="model-options"></div>
    </section>

    <!-- Generate Button -->
    <section id="generate-section" style="display:none;">
        <button id="generate-btn">Generate Passwords</button>
    </section>

    <!-- Output Section -->
    <section id="output-section" style="display:none;">
        <h2>Your Passwords</h2>
        <div id="password-list"></div>
    </section>

    <!-- Footer -->
    <footer id="main-footer">
        <a href="privacy.html">Privacy Policy</a>
        <span class="divider">|</span>
        <a href="terms.html">Terms & Conditions</a>
        <span class="divider">|</span>
        <a href="contact.html">Contact</a>
    </footer>

</div>

<script src="app.js"></script>
</body>
</html>
